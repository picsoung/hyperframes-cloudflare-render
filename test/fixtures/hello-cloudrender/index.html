<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>hello-cloudrender</title>
    <meta name="hf-duration" content="4" />
    <meta name="hf-fps" content="30" />
    <meta name="hf-width" content="1920" />
    <meta name="hf-height" content="1080" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b0f14;
        color: #fff;
        font-family: system-ui, sans-serif;
        overflow: hidden;
      }
      .stage {
        position: relative;
        width: 100vw;
        height: 100vh;
        display: grid;
        place-items: center;
      }
      .card {
        text-align: center;
      }
      .title {
        font-size: 96px;
        font-weight: 800;
        letter-spacing: -2px;
        margin: 0 0 24px;
      }
      .sub {
        font-size: 32px;
        opacity: 0.7;
        margin: 0;
      }
      .logo {
        width: 200px;
        height: 200px;
        margin: 0 auto 48px;
      }
      /* Heavy media — these refs will be rewritten by sync-composition to R2 URLs. */
      .clip {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        opacity: 0.2;
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <video class="clip" src="assets/videos/clip.mp4" muted autoplay></video>
      <audio src="assets/audio/beep.mp3" autoplay></audio>
      <div class="card">
        <img class="logo" src="assets/images/logo.svg" alt="" />
        <h1 class="title">Hello, cloudrender</h1>
        <p class="sub">4-second smoke test for the cloudflare-render pipeline.</p>
      </div>
    </div>
  </body>
</html>
